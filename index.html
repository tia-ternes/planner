<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Planner"><meta name="theme-color" content="#9c36b5"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Fredoka:wght@400;500;600&family=Playfair+Display:wght@500;700&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f3f1fb;--sf:#fff;--ink:#1c2230;--mute:#667085;--line:#dcdfea;--ac:#9c36b5;--ac2:#e64980;--on:#fff;--r:18px;--rb:12px;--pad:14px;
--font:'DM Sans',system-ui,sans-serif;color-scheme:light;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--sf:#1e212d;--ink:#eef0f7;--mute:#9aa1b5;--line:#2e3243;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161f;--sf:#1e212d;--ink:#eef0f7;--mute:#9aa1b5;--line:#2e3243;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);min-height:100vh}
:root[data-bg=dots] body{background-image:radial-gradient(var(--line) 1.6px,transparent 1.6px);background-size:22px 22px}
:root[data-bg=grid] body{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
:root[data-bg=wash] body{background-image:linear-gradient(160deg,color-mix(in srgb,var(--ac) 16%,var(--bg)),color-mix(in srgb,var(--ac2) 16%,var(--bg)));background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.band{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);padding:18px 18px 26px;border-radius:0 0 calc(var(--r)*1.6) calc(var(--r)*1.6);position:relative;overflow:hidden}
.band:before,.band:after{content:"";position:absolute;border-radius:50%;background:var(--on);opacity:.12}
.band:before{width:220px;height:220px;right:-60px;top:-80px}.band:after{width:120px;height:120px;right:90px;bottom:-60px}
.in{max-width:960px;margin:0 auto;position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.cu{background:transparent;color:var(--on);border:2px solid var(--on);border-radius:var(--rb);padding:8px 16px;min-height:44px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--on);color:var(--ac)}
h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.05;margin:20px 0 0;font-weight:800;letter-spacing:-.02em}
.sub{margin:6px 0 0;opacity:.92}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:14px;max-width:360px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--on);border-radius:99px}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px;display:grid;gap:18px}
@media(min-width:760px){.wrap{grid-template-columns:230px 1fr}}
.lists{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
@media(min-width:760px){.lists{flex-direction:column;overflow:visible}}
.chip{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;background:var(--sf);border:2px solid transparent;border-radius:var(--r);padding:10px 14px;min-height:46px;align-items:center;box-shadow:0 3px 10px rgba(30,30,60,.08);text-align:left}
.chip[aria-current="true"]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--sf));font-weight:700}
.chip small{color:var(--mute);font-weight:700}
.nl{display:flex;gap:6px;margin-top:10px}
input[type=text],input[type=password],input[type=time],input[type=date],textarea,select{background:var(--sf);border:2px solid var(--line);border-radius:var(--rb);padding:10px 14px;min-height:44px;width:100%}
textarea{min-height:120px;resize:vertical}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);border:0;border-radius:var(--rb);padding:10px 18px;min-height:44px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);font-weight:500}
.panel{background:var(--sf);border-radius:var(--r);padding:18px;box-shadow:0 8px 24px rgba(30,30,60,.10)}
:root[data-card=outline] .panel,:root[data-card=outline] .chip{box-shadow:none;border:2px solid var(--ink)}
:root[data-card=flat] .panel,:root[data-card=flat] .chip{box-shadow:none;background:color-mix(in srgb,var(--ac) 7%,var(--sf))}
.add{display:flex;gap:8px;margin-bottom:6px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:var(--pad) 0;border-bottom:2px dashed var(--line)}
li:last-child{border-bottom:0}
li .t{flex:1;overflow-wrap:anywhere}
li.done .t{color:var(--mute);text-decoration:line-through}
.ck{width:30px;height:30px;flex:none;border:3px solid var(--ac);border-radius:calc(var(--rb)*.7);background:transparent;color:var(--on);padding:0;font-weight:800}
.done .ck{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.x{background:none;border:0;color:var(--mute);min-width:44px;min-height:44px;font-size:1.4rem}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);margin-top:12px;gap:8px;flex-wrap:wrap}
.empty{color:var(--mute);padding:18px 0}
.note{max-width:960px;margin:0 auto;padding:0 18px 30px;color:var(--mute);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools .seg{width:auto}.tools .seg button{padding:8px 12px}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--sf);box-shadow:0 0 0 2px var(--line);padding:0}
.dot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.desk{background:color-mix(in srgb,var(--ac) 10%,var(--bg));padding:clamp(10px,3vw,24px);border-radius:var(--r)}
#cv{width:100%;max-width:760px;margin:0 auto;display:block;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.25),0 12px 28px rgba(20,20,50,.28);background:#fff;cursor:crosshair;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.emo{background:rgba(255,255,255,.22);border:2px dashed var(--on);border-radius:var(--rb);font-size:inherit;line-height:1;padding:4px 10px;min-height:44px;vertical-align:middle;margin-right:8px}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:8px}
.eg button{font-size:1.5rem;background:none;border:2px solid var(--line);border-radius:var(--rb);min-height:46px}
.eg button[aria-pressed="true"]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--sf))}
.wrap.cal{grid-template-columns:1fr}
@media(min-width:760px){.wrap.cal{grid-template-columns:1fr 330px}}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cg .dn{text-align:center;color:var(--mute);font-size:.8rem;font-weight:700}
.day{min-height:48px;border-radius:var(--rb);background:transparent;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.day.today{border-color:var(--ac)}
.day[aria-pressed="true"]{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);font-weight:700}
.dts{display:flex;gap:3px;height:7px}.dts i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 1.5px var(--sf)}
.ev{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dashed var(--line)}
.ev:last-child{border-bottom:0}.ev b{width:12px;height:12px;border-radius:50%;flex:none}.ev .tm{color:var(--mute);min-width:4.2em;font-size:.9rem}
.cnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.row select{width:auto;flex:1;min-width:130px}
.st{color:var(--mute);margin:8px 0 0;min-height:1.4em}
.back{position:fixed;inset:0;background:rgba(10,10,30,.5);z-index:20}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--sf);border-radius:var(--r) var(--r) 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.3)}
@media(min-width:760px){.sheet{left:auto;right:20px;bottom:20px;width:380px;border-radius:var(--r)}}
.sheet h2{margin:0 0 4px;font-size:1.3rem}.sheet h3{margin:16px 0 6px;font-size:.95rem}
.sheet p{margin:0;color:var(--mute);font-size:.88rem}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pre{height:44px;min-width:70px;border-radius:var(--rb);border:3px solid var(--sf);box-shadow:0 0 0 2px var(--line);color:#fff;font-weight:700;font-size:.8rem;padding:0 8px}
.pre[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sw input[type=color]{width:46px;height:44px;border:0;padding:0;background:none}
.seg{display:flex;border:2px solid var(--line);border-radius:var(--rb);overflow:hidden;width:100%}
.seg button{flex:1;background:none;border:0;padding:10px 6px;min-height:44px}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);font-weight:700}
.dh{touch-action:none;background:none;border:0;color:var(--mute);min-width:34px;min-height:44px;cursor:grab;font-size:1.1rem;padding:0}
li.lift{background:color-mix(in srgb,var(--ac) 14%,var(--sf));box-shadow:0 6px 16px rgba(0,0,0,.2)}
.tb{background:none;border:0;text-align:left;padding:6px 0;min-height:44px;color:inherit}
.due{font-size:.8rem;font-weight:700;color:var(--mute);background:color-mix(in srgb,var(--ac) 12%,var(--sf));padding:2px 8px;border-radius:99px;white-space:nowrap}
.due.od{color:#e03131;background:color-mix(in srgb,#e03131 12%,var(--sf))}
.cu+.cu{margin-left:6px}
.cw{display:flex;align-items:center;gap:2px}.cw .chip{flex:1}.cw.lift{opacity:.85;box-shadow:0 6px 16px rgba(0,0,0,.2);border-radius:var(--r)}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.wd{border:2px solid var(--line);border-radius:var(--rb);padding:6px;min-height:90px}.wd.sel{border-color:var(--ac)}
.wh{background:none;border:0;font-weight:700;padding:4px 2px;min-height:36px;width:100%;text-align:center}.wh.today{color:var(--ac)}
.we{display:flex;gap:6px;align-items:flex-start;font-size:.85rem;padding:2px 0;overflow-wrap:anywhere}.we b{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.wrap.nb{max-width:1280px;grid-template-columns:1fr;padding:12px 10px}
.nb .panel{padding:10px}
.nb nav{display:flex;gap:8px;align-items:center}
.nb nav .lists{flex:1;flex-direction:row;overflow-x:auto}
.nb nav>.btn{width:auto!important;margin:0!important;white-space:nowrap;flex:none}
.nb .tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--sf);padding:8px 4px;margin:0 0 8px;border-bottom:2px solid var(--line)}
.nb .desk{padding:clamp(4px,1.5vw,14px)}
.nb #cv{max-width:none}
.nb .desk{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tools .btn{padding:8px 12px}
.fs .band,.fs .note,.fs .nb nav,.fs #ntitle,.fs .nbx{display:none}
.fs .wrap.nb{max-width:none;padding:6px}
.fs .panel{padding:6px;box-shadow:none;background:transparent}
.fs .desk{padding:6px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script>
const KEY='planner-v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const FONTS={sans:"'DM Sans',system-ui,sans-serif",round:"'Fredoka',ui-rounded,system-ui,sans-serif",serif:"'Playfair Display',Georgia,serif",hand:"'Caveat','Bradley Hand',cursive",mono:"'IBM Plex Mono',ui-monospace,monospace"};
const PRE=[['Berry','#9c36b5','#e64980'],['Sunset','#c2255c','#e8590c'],['Ocean','#1864ab','#0b7285'],['Forest','#2b8a3e','#0b7285'],['Dusk','#364fc7','#862e9c']];
const INKS=['#1c2230','#1864ab','#c2255c','#2b8a3e','#e8590c'],ICONS=['✨','🏡','🛒','💼','📌','🍳'];
const mk=(t,d)=>({id:uid(),t,done:!!d});
const def=()=>({font:'sans',corners:'soft',card:'shadow',bg:'plain',density:'cozy',mode:'auto',space:'p',tool:'pen',ink:INKS[0],size:4,finger:false,note:'n1',cal:{y:new Date().getFullYear(),m:new Date().getMonth(),sel:''},events:[],
notes:[{id:'n1',title:'Brain dump',paper:'lined',strokes:[],text:''}],spaces:[
{id:'p',name:'Personal',accent:'#9c36b5',accent2:'#e64980',list:'p1',lists:[
{id:'p1',name:'This week',ic:'✨',items:[mk('Book dentist appointment'),mk('Call the plumber',1),mk('Order birthday gift')]},
{id:'p2',name:'Home',ic:'🏡',items:[mk('Replace hallway bulb')]}]},
{id:'w',name:'Work',accent:'#1864ab',accent2:'#0b7285',list:'w1',lists:[
{id:'w1',name:'Projects',ic:'💼',items:[mk('Draft Q4 plan'),mk('Review budget sheet')]},
{id:'w2',name:'Follow-ups',ic:'📌',items:[mk('Reply to vendor quote')]}]},
{id:'n',name:'Notes',kind:'notes',accent:'#e8590c',accent2:'#c2255c'},
{id:'c',name:'Calendar',kind:'cal',accent:'#2b8a3e',accent2:'#0b7285'},
{id:'t',name:'Today',kind:'today',accent:'#c92a2a',accent2:'#e8590c'}]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const D=def();
if(!S||!S.spaces)S=D;else{for(const k in D)if(S[k]===undefined)S[k]=D[k];
if(!S.spaces.some(x=>x.kind==='notes'))S.spaces.push(D.spaces[2]);
if(!S.spaces.some(x=>x.kind==='cal'))S.spaces.push(D.spaces[3]);
if(!S.spaces.some(x=>x.kind==='today'))S.spaces.push(D.spaces[4]);
S.spaces.forEach(x=>{if(!x.accent2)x.accent2=x.id==='p'?'#e64980':'#0b7285';(x.lists||[]).forEach(l=>{if(!l.ic)l.ic='✨'})})}
S.notes.forEach(n=>{if(!n.pages){n.pages=[{strokes:n.strokes||[]}];delete n.strokes}n.pg=n.pg||0});
S.spaces.sort((a,b)=>{const o=x=>({today:0,notes:3,cal:4})[x.kind]??(x.id==='p'?1:2);return o(a)-o(b)});
let ed=null,srch=false,sheet=false,sure=0,snd={s:'p',l:''},cv,cx,W=0,dr=null,pick=false,sc=null,RT=1.294,full=false,pts={},pz=null,scx=0;
const LOC=['space','note','tool','ink','size','finger','cal','cv','zoom','upd'],sj=()=>JSON.stringify(Object.fromEntries(Object.entries(S).filter(([k])=>!LOC.includes(k))));
const sy={st:'Local only',base:null,last:sj(),c:[],t:0,timer:0,retry:0};
const save=()=>{const j=sj();if(j!==sy.last){S.upd=Date.now();sy.last=j;if(sy.base){clearTimeout(sy.timer);sy.timer=setTimeout(doPush,1500)}}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const sp=()=>S.spaces.find(x=>x.id===S.space),isN=()=>sp().kind==='notes',isC=()=>sp().kind==='cal',isT=()=>sp().kind==='today';
const cur=()=>{const s=sp();return s.lists.find(l=>l.id===s.list)||s.lists[0]};
const nt=()=>S.notes.find(n=>n.id===S.note)||S.notes[0],pgc=()=>{const n=nt();return n.pages[n.pg]||n.pages[0]};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function on(h){const n=parseInt(h.slice(1),16),f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};
return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)>.2?'#10161c':'#fff'}
function theme(){const r=document.documentElement,s=sp(),p=r.style;
p.setProperty('--ac',s.accent);p.setProperty('--ac2',s.accent2);p.setProperty('--on',on(s.accent));p.setProperty('--font',FONTS[S.font]||FONTS.sans);
const c={soft:['18px','12px'],pill:['28px','999px'],sharp:['4px','4px']}[S.corners]||['18px','12px'];
p.setProperty('--r',c[0]);p.setProperty('--rb',c[1]);p.setProperty('--pad',S.density==='cozy'?'14px':'7px');
r.dataset.card=S.card;r.dataset.bg=S.bg;S.mode==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.mode)}
const seg=(a,o,c)=>`<div class="seg">${o.map(([v,l])=>`<button data-act="${a}" data-v="${v}" aria-pressed="${String(c)===String(v)}">${l}</button>`).join('')}</div>`;
function listsView(){const s=sp(),l=cur(),open=l.items.filter(i=>!i.done).length,dn=l.items.length-open;
return{h:`<button class="emo" data-act="pick" aria-label="Change icon">${l.ic}</button>${esc(l.name)}`,sub:`${s.name} · ${open} to do`,pct:l.items.length?dn/l.items.length*100:0,
body:`<div class="wrap"><nav aria-label="Lists"><div class="lists">${s.lists.map(x=>`<div class="cw" data-did="${x.id}"><button class="chip" style="flex:1" data-act="list" data-id="${x.id}" aria-current="${x.id===l.id}"><span>${x.ic} ${esc(x.name)}</span><small>${x.items.filter(i=>!i.done).length}</small></button><button class="dh" aria-label="Drag to reorder">⠿</button></div>`).join('')}</div>
<form class="nl" id="newl"><input type="text" id="nln" placeholder="New list" aria-label="New list name"><button class="btn ghost">Add</button></form></nav>
<section class="panel"><form class="add" id="addf"><input type="text" id="add" placeholder="Add an item" aria-label="New item"><button class="btn">Add</button></form>
${l.items.length?`<ul>${l.items.map(i=>`<li class="${i.done?'done':''}" data-did="${i.id}"><button class="dh" aria-label="Drag to reorder">⠿</button><button class="ck" data-act="tog" data-id="${i.id}" aria-label="${i.done?'Mark not done':'Mark done'}">${i.done?'✓':''}</button><button class="t tb" data-act="edit" data-k="item" data-id="${i.id}">${esc(i.t)}</button>${i.due?`<small class="due${i.due<tdy()&&!i.done?' od':''}">${fd(i.due)}</small>`:''}<button class="x" data-act="del" data-id="${i.id}" aria-label="Delete ${esc(i.t)}">×</button></li>`).join('')}</ul>`:`<p class="empty">Nothing here yet. Add the first item above.</p>`}
<div class="meta"><span>${dn} of ${l.items.length} done</span><span>${dn?'<button class="btn ghost" data-act="clear">Clear done</button> ':''}<button class="btn ghost" data-act="edit" data-k="list" data-id="${l.id}">Rename</button> ${s.lists.length>1?`<button class="btn ghost" data-act="dlist">${sure===1?'Tap again to delete list':'Delete list'}</button>`:''}</span></div></section></div>`}}
function notesView(){const n=nt(),tgt=S.spaces.filter(x=>x.lists),ts=tgt.find(x=>x.id===snd.s)||tgt[0];if(!ts.lists.some(l=>l.id===snd.l))snd.l=ts.lists[0].id;
return{h:`<button class="emo" data-act="pick" aria-label="Change icon">${n.ic||'✏️'}</button>${esc(n.title||'Untitled')}`,sub:`${S.notes.length} notebook${S.notes.length>1?'s':''} · page ${n.pg+1} of ${n.pages.length}`,pct:0,
body:`<div class="wrap nb"><nav aria-label="Notes"><div class="lists">${S.notes.map(x=>`<button class="chip" data-act="note" data-id="${x.id}" aria-current="${x.id===n.id}"><span>${x.ic||'📝'} ${esc(x.title||'Untitled')}</span></button>`).join('')}</div>
<button class="btn ghost" style="margin-top:10px;width:100%" data-act="nnew">New notebook</button></nav>
<section class="panel"><input type="text" id="ntitle" value="${esc(n.title)}" placeholder="Notebook title" aria-label="Notebook title" style="margin-bottom:12px">
<div class="tools">${seg('tool',[['pen','Pen'],['mark','Marker'],['erase','Eraser']],S.tool)}

if(k==='lined'){for(let y=g*2;y<h;y+=g){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}c.strokeStyle='#f0a5a5';c.beginPath();c.moveTo(g*1.6,0);c.lineTo(g*1.6,h);c.stroke()}
if(k==='grid'){for(let y=g;y<h;y+=g){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}for(let x=g;x<w;x+=g){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}}
if(k==='dots'){for(let y=g;y<h;y+=g)for(let x=g;x<w;x+=g){c.beginPath();c.arc(x,y,1.3,0,7);c.fill()}}}
function seg1(c,s,w,a,b){c.lineCap=c.lineJoin='round';c.strokeStyle=s.c;c.globalAlpha=s.t==='mark'?.35:1;c.lineWidth=s.w*(s.t==='mark'?4:1);
c.beginPath();c.moveTo(a[0]*w,a[1]*w);c.lineTo(b[0]*w,b[1]*w);c.stroke();c.globalAlpha=1}
function stroke(c,s,w){const p=s.p;if(p.length===1)seg1(c,s,w,p[0],[p[0][0]+.0001,p[0][1]]);for(let i=1;i<p.length;i++)seg1(c,s,w,p[i-1],p[i])}
function redraw(){const n=nt();paper(cx,W,W*RT,n.paper);pgc().strokes.forEach(s=>stroke(cx,s,W))}
function setup(){cv=$('#cv');cv.style.width=(S.zoom||1)*100+'%';W=cv.clientWidth;const d=Math.min(devicePixelRatio||1,Math.sqrt(12e6/(W*W*RT)));cv.width=W*d;cv.height=W*RT*d;cv.style.height='auto';cv.style.aspectRatio='1/'+RT;
cx=cv.getContext('2d');cx.setTransform(d,0,0,d,0,0);cv.style.touchAction='none';redraw();
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.width]};
const erase=q=>{const n=pgc(),k=n.strokes.length;n.strokes=n.strokes.filter(s=>!s.p.some(a=>Math.hypot(a[0]-q[0],a[1]-q[1])<.03));if(n.strokes.length!==k)redraw()};
cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}if(e.pointerType==='touch'&&!S.finger){pts[e.pointerId]=[e.clientX,e.clientY];sc=e.clientY;scx=e.clientX;const k=Object.keys(pts);if(k.length===2){const a=pts[k[0]],b=pts[k[1]];pz={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,z:S.zoom||1,n:0}}return}sc=null;const q=pos(e);
if(S.tool==='erase'){dr='e';erase(q);return}dr={t:S.tool,c:S.ink,w:+S.size,p:[q]};pgc().strokes.push(dr);stroke(cx,dr,W)};
cv.onpointermove=e=>{if(e.pointerType==='touch'&&!S.finger){if(pts[e.pointerId])pts[e.pointerId]=[e.clientX,e.clientY];const k=Object.keys(pts);if(k.length>=2&&pz){const a=pts[k[0]],b=pts[k[1]],z=Math.max(1,Math.min(2.5,pz.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pz.d));pz.n=z;cv.style.width=z*100+'%'}else if(sc!==null&&k.length===1){scrollBy(0,sc-e.clientY);cv.parentNode.scrollLeft+=scx-e.clientX;sc=e.clientY;scx=e.clientX}return}if(!dr)return;e.preventDefault();const ev=e.getCoalescedEvents?e.getCoalescedEvents():[];for(const u of(ev.length?ev:[e])){const q=pos(u);if(dr==='e'){erase(q);continue}const l=dr.p[dr.p.length-1];dr.p.push(q);seg1(cx,dr,W,l,q)}};
cv.onpointerup=cv.onpointercancel=cv.onlostpointercapture=e=>{delete pts[e.pointerId];if(pz&&Object.keys(pts).length<2){const dk=cv.parentNode,r=(dk.scrollLeft+dk.clientWidth/2)/dk.scrollWidth;if(pz.n){S.zoom=pz.n;save()}pz=null;setup();dk.scrollLeft=r*dk.scrollWidth-dk.clientWidth/2}if(dr)save();dr=null;sc=null};cv.oncontextmenu=e=>e.preventDefault()}
const st=t=>{const e=$('#st');if(e)e.textContent=t};

if(a!=='dlist'&&a!=='nclear')sure=0;

else if(a==='zoom')S.zoom=Math.max(1,Math.min(2.5,(S.zoom||1)+(+v)));
else if(a==='finger')S.finger=!S.finger;
else if(a==='send'){const t=S.spaces.find(x=>x.id===snd.s).lists.find(x=>x.id===snd.l),n=nt();
const ls=n.text.split('\n').map(x=>x.replace(/^\s*[-•*]\s*/,'').trim()).filter(Boolean);

else if(a==='edit')ed={k:b.dataset.k,id};
else if(a==='eclose')ed=null;
else if(a==='esave'||a==='esaveics'){const o=edT(),k=ed.k,x=$('#ef1').value.trim();if(x){if(k==='item'||k==='event')o.t=x;else if(k==='list')o.name=x;else o.title=x}
if(k==='item')o.due=$('#ef2').value;if(k==='event'){o.d=$('#ef2').value||o.d;o.tm=$('#ef3').value;o.r=$('#ef4').value}if(k==='item'||k==='event'){const r=$('#ef5').value;if(r==='')delete o.rem;else o.rem=+r}ed=null;if(a==='esaveics'){const x=k==='item'?(o.due?{id:o.id,t:o.t,d:o.due,tm:'',r:'',rem:o.rem}:null):o;if(x)setTimeout(()=>icsSave([x]),0);else msg('Set a due date first.')}}
else if(a==='edel'){const k=ed.k;if(k==='item'){const f=findItem(ed.id);f.l.items=f.l.items.filter(y=>y.id!==ed.id)}
else if(k==='list'){s.lists=s.lists.filter(y=>y.id!==l.id);s.list=s.lists[0].id}
else if(k==='note'){S.notes=S.notes.filter(y=>y.id!==ed.id);S.note=S.notes[0].id}else S.events=S.events.filter(y=>y.id!==ed.id);ed=null}
else if(a==='ttog'){const f=findItem(id);f.it.done=!f.it.done}
else if(a==='srch')srch=true;else if(a==='sclose')srch=false;
else if(a==='go'){const q=v.split('|');srch=false;if(q[0]==='i'){S.space=q[1];sp().list=q[2]}else if(q[0]==='e'){S.space=S.spaces.find(y=>y.kind==='cal').id;const d=dt(q[1]);S.cal={y:d.getFullYear(),m:d.getMonth(),sel:q[1]}}else{S.space=S.spaces.find(y=>y.kind==='notes').id;S.note=q[1]}}
else if(a==='ppg')nt().pg=Math.max(0,nt().pg-1);
else if(a==='npg')nt().pg=Math.min(nt().pages.length-1,nt().pg+1);
else if(a==='addpg'){const n=nt();n.pages.splice(n.pg+1,0,{strokes:[]});n.pg++}
else if(a==='delpg'){const n=nt();n.pages.splice(n.pg,1);n.pg=Math.min(n.pg,n.pages.length-1)}
else if(a==='pick')pick=true;
else if(a==='pclose')pick=false;
else if(a==='emo'){(isN()?nt():cur()).ic=v;pick=false}
else if(a==='cprev'||a==='cnext'){const c=S.cal,sg=a==='cnext'?1:-1;if(S.cv==='week'){const d=dt(c.sel||tdy());d.setDate(d.getDate()+7*sg);c.sel=ds(d.getFullYear(),d.getMonth(),d.getDate());c.y=d.getFullYear();c.m=d.getMonth()}else{const d=new Date(c.y,c.m+sg,1);c.y=d.getFullYear();c.m=d.getMonth()}}
else if(a==='ctoday'){const n=new Date();S.cal={y:n.getFullYear(),m:n.getMonth(),sel:ds(n.getFullYear(),n.getMonth(),n.getDate())}}
else if(a==='day'){const d=dt(v);S.cal.y=d.getFullYear();S.cal.m=d.getMonth();S.cal.sel=v}
else if(a==='evdel')S.events=S.events.filter(x=>x.id!==id);
else S[a]=v;
save();render()});

const li=h.closest('[data-did]'),ul=li.parentNode,hz=ul.classList.contains('lists')&&getComputedStyle(ul).flexDirection==='row';li.classList.add('lift');
